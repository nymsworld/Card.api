<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e31515">
  <title>Kanto Misplay Society - Price Check</title>
  <script>
    // The site's home address. Visits to the old GitHub Pages address (printed on older QR
    // stickers) are sent there with the same card and condition. Empty = stay on GitHub Pages.
    var SITE_HOME = 'https://kantomisplay.cc/';
    if (SITE_HOME && location.hostname === 'nymsworld.github.io') location.replace(SITE_HOME + location.search + location.hash);

    // Which shop's sticker brought the customer here: K = Kanto Misplay Society, G = GG Crafts &
    // Collectibles. Short sticker links (kantomisplay.cc/G/SV3PT5-199/LP: shop, card, condition, in
    // capitals for a smaller QR code) become the usual ?shop=gg&id=…&cond=… address before anything
    // reads it. GG gets its own logo, name and colors; prices are the same.
    var SHOP_LETTERS = { K: 'kms', G: 'gg' };
    var SHOP = 'kms';
    function stickerLink(text) {
      try {
        var url = new URL(String(text || '').trim());
        var path = url.pathname.match(/^\/([A-Za-z])\/([^\/]+)(?:\/([^\/]+))?\/?$/);
        if (path && SHOP_LETTERS[path[1].toUpperCase()]) {
          return { shop: SHOP_LETTERS[path[1].toUpperCase()], id: decodeURIComponent(path[2]), cond: path[3] ? decodeURIComponent(path[3]).toUpperCase() : null };
        }
        if (url.searchParams.get('id')) {
          return { shop: url.searchParams.get('shop') === 'gg' ? 'gg' : null, id: url.searchParams.get('id').trim(), cond: url.searchParams.get('cond') };
        }
      } catch (e) {}
      return null;
    }
    // ?shop=gg&id=… (GG only, so KMS addresses look as they always have)
    function shopQuery(id, cond) {
      return '?' + (SHOP === 'gg' ? 'shop=gg&' : '') + 'id=' + encodeURIComponent(id) + (cond ? '&cond=' + encodeURIComponent(cond) : '');
    }
    (function () {
      var short = stickerLink(location.href);
      if (short && short.shop && !location.search) {
        SHOP = short.shop;
        history.replaceState(null, '', '/' + shopQuery(short.id, short.cond) + location.hash);
      }
      if (new URLSearchParams(location.search).get('shop') === 'gg') {
        SHOP = 'gg';
        document.documentElement.setAttribute('data-shop', 'gg');
      }
    })();
    // The header's name and logo; runs right after they're drawn and when a GG sticker is scanned
    function showShop(shop) {
      if (window.KMSApp) return; // the staff app has its own shop profiles
      SHOP = shop === 'gg' ? 'gg' : 'kms';
      var gg = SHOP === 'gg';
      if (gg) document.documentElement.setAttribute('data-shop', 'gg');
      else document.documentElement.removeAttribute('data-shop');
      var name = document.querySelector('.brand-name');
      var logo = document.querySelector('.brand-logo');
      if (name) name.textContent = gg ? 'GG Crafts & Collectibles' : 'Kanto Misplay Society';
      if (logo) { logo.src = gg ? 'gg-logo.png' : 'logo.jpg'; logo.alt = gg ? 'GG logo' : 'KMS logo'; }
      var icon = document.querySelector('link[rel="icon"]');
      if (icon) icon.href = gg ? 'gg-logo.png' : 'logo.jpg';
      document.title = (gg ? 'GG Crafts & Collectibles' : 'Kanto Misplay Society') + ' - Price Check';
      document.querySelector('meta[name="theme-color"]').content = gg ? '#fbdcdc' : '#e31515';
    }

    // Apply the saved theme before the page draws (dark is the default)
    try {
      if (localStorage.getItem('kms_theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  </script>
  <link rel="icon" href="logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    /* Colors taken from the KMS Pokeball logo. Dark theme is the default. */
    :root {
      --kms-red: #e31515;
      --kms-red-dark: #b80e0e;
      --kms-black: #111111;
      --kms-white: #ffffff;

      --bg-page: #0d0d0f;
      --bg-card: #18181b;
      --surface: #222226;
      --border-color: #34343a;
      --line-soft: #2a2a2f;
      --card-shadow: #000000;
      --text-main: #f5f5f5;
      --text-sub: #a1a1aa;
      --band-bg: #000000;
      --band-border: #34343a;
      --btn-alt-bg: #f5f5f5;
      --btn-alt-fg: #111111;
      --btn-outline-bg: transparent;
      --error-color: #ff6b6b;
      --logo-ring: #000000;
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg-page: #f3f3f3;
      --bg-card: #ffffff;
      --surface: #ffffff;
      --border-color: #111111;
      --line-soft: #e2e2e2;
      --card-shadow: #111111;
      --text-main: #111111;
      --text-sub: #5f5f5f;
      --band-bg: #111111;
      --band-border: #111111;
      --btn-alt-bg: #111111;
      --btn-alt-fg: #ffffff;
      --btn-outline-bg: #ffffff;
      --error-color: #b80e0e;
      --logo-ring: #111111;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    body {
      font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: var(--bg-page);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 0 1rem 7.5rem 1rem;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Red Pokeball dome header */
    .brand {
      position: relative;
      width: calc(100% + 2rem);
      margin: 0 -1rem;
      background: var(--kms-red);
      border-bottom: 6px solid var(--kms-black);
      border-radius: 0 0 50% 50% / 0 0 48px 48px;
      padding: 1.25rem 3.5rem 3.75rem 3.5rem;
      text-align: center;
      color: var(--kms-white);
    }

    .brand-name {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .brand-tag {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.85;
      margin-top: 4px;
    }

    /* Dark / light toggle in the header corner */
    .theme-toggle {
      position: absolute;
      top: 0.9rem;
      right: 0.9rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid var(--kms-black);
      background: var(--kms-white);
      color: var(--kms-black);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .theme-toggle svg { width: 20px; height: 20px; }
    .theme-toggle .icon-sun { display: none; }
    :root[data-theme="light"] .theme-toggle .icon-sun { display: block; }
    :root[data-theme="light"] .theme-toggle .icon-moon { display: none; }

    /* Logo sits on the header's edge like a Pokeball button */
    .brand-logo {
      display: block;
      width: 92px;
      height: 92px;
      margin: -46px auto 1rem auto;
      border-radius: 50%;
      border: 6px solid var(--logo-ring);
      background: var(--kms-white);
      object-fit: cover;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--bg-card);
      border: 3px solid var(--border-color);
      border-radius: 20px;
      padding: 1.75rem 1.25rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 8px 0 var(--card-shadow);
    }

    .card-art {
      display: block;
      width: 160px;
      height: auto;
      border-radius: 8px;
      margin: 0 auto 0.85rem auto;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--kms-red);
      background: transparent;
      border: 2px solid var(--kms-red);
      padding: 3px 12px;
      border-radius: 999px;
      margin-bottom: 0.6rem;
    }

    h1, h2 {
      font-weight: 900;
      color: var(--text-main);
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 0.25rem 0;
    }

    .set-info {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-sub);
      margin-bottom: 1rem;
    }

    /* Black band with a center button, like the middle of a Pokeball */
    .price-container {
      position: relative;
      margin: 0.75rem 0 1.5rem 0;
      padding: 0.85rem 0.85rem 1.4rem 0.85rem;
      background: var(--band-bg);
      border: 2px solid var(--band-border);
      color: var(--kms-white);
      border-radius: 14px;
      text-align: center;
    }

    .price-container::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -14px;
      width: 26px;
      height: 26px;
      margin-left: -13px;
      border-radius: 50%;
      background: var(--kms-white);
      border: 5px solid var(--band-bg);
      box-shadow: 0 0 0 2px var(--band-border);
    }

    .label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.7);
    }

    .price {
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--kms-white);
      margin-top: 0.1rem;
    }

    /* Condition picker (overnumbered cards only) */
    .condition-picker { margin: 0.25rem 0 0.75rem 0; }
    .condition-picker .label { color: var(--text-sub); margin-bottom: 0.4rem; }
    .condition-options { display: flex; gap: 0.35rem; }
    .condition-btn {
      flex: 1;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 0.5rem 0;
      border-radius: 10px;
      border: 2px solid var(--border-color);
      background: var(--surface);
      color: var(--text-main);
      cursor: pointer;
    }
    .condition-btn.active {
      background: var(--kms-red);
      border-color: var(--kms-red);
      color: var(--kms-white);
    }

    .floor-note {
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 2px;
    }

    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .btn {
      display: inline-block;
      width: 100%;
      font-family: inherit;
      color: var(--kms-white);
      text-align: center;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      border: 3px solid var(--kms-black);
      cursor: pointer;
    }

    .btn:active { transform: translateY(2px); filter: brightness(0.92); }
    .btn-cart { background: var(--kms-red); }
    .btn-scan { background: var(--btn-alt-bg); color: var(--btn-alt-fg); border-color: var(--btn-alt-bg); }
    .btn-link {
      background: var(--btn-outline-bg);
      color: var(--text-main);
      border-color: var(--border-color);
      font-size: 0.85rem;
      padding: 0.65rem 1rem;
    }

    .loading { color: var(--text-sub); font-size: 0.95rem; font-weight: 600; }
    .error { color: var(--error-color); font-size: 0.9rem; font-weight: 600; line-height: 1.4; padding: 10px; }
    .empty-state { padding: 1rem 0; }
    .empty-state p { color: var(--text-sub); font-size: 0.9rem; }

    /* Sticky Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #000000;
      border-top: 5px solid var(--kms-red);
      padding: 0.85rem 1.25rem;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.3);
      z-index: 50;
    }

    .cart-bar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 820px;
      margin: 0 auto;
    }

    .cart-summary-text { font-size: 0.8rem; font-weight: 600; color: rgba(255, 255, 255, 0.7); }
    .cart-summary-total { font-size: 1.3rem; font-weight: 900; color: var(--kms-white); }
    .cart-buttons { display: flex; gap: 0.5rem; }
    .cart-bar-btn {
      font-family: inherit;
      background: var(--kms-white);
      color: var(--kms-black);
      border: 2px solid var(--kms-white);
      border-radius: 10px;
      padding: 0.55rem 0.9rem;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .cart-bar-btn-scan { background: var(--kms-red); border-color: var(--kms-red); color: var(--kms-white); }

    /* Modal / Drawer Overlays */
    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }

    .drawer-overlay.active { display: flex; }

    .drawer {
      background: var(--bg-card);
      border: 3px solid var(--border-color);
      border-bottom: none;
      border-radius: 22px 22px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      background: var(--kms-red);
      border-bottom: 4px solid var(--kms-black);
    }

    .drawer-header h2 { margin: 0; font-size: 1.1rem; color: var(--kms-white); }
    .close-btn {
      background: transparent;
      border: none;
      color: var(--kms-white);
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
    }

    .cart-items {
      overflow-y: auto;
      flex: 1;
      margin: 0.5rem 0;
      padding: 0 1.25rem;
    }

    .cart-empty { text-align: center; color: var(--text-sub); margin: 2rem 0; }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--line-soft);
    }

    .cart-item-info { flex: 1; padding-right: 0.5rem; text-align: left; }
    .cart-item-title { font-size: 0.9rem; font-weight: 800; }
    .cart-item-meta { font-size: 0.75rem; color: var(--text-sub); }
    .cart-item-price { font-size: 0.95rem; font-weight: 800; color: var(--kms-red); margin-top: 2px; }

    .qty-controls { display: flex; align-items: center; gap: 0.5rem; }
    .qty-btn {
      font-family: inherit;
      background: var(--surface);
      border: 2px solid var(--border-color);
      color: var(--text-main);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .qty-count { font-size: 0.9rem; font-weight: 800; min-width: 18px; text-align: center; }
    .del-btn {
      background: transparent;
      border: none;
      color: var(--kms-red);
      font-size: 1.3rem;
      font-weight: 700;
      margin-left: 0.25rem;
      cursor: pointer;
    }

    .drawer-footer {
      border-top: 3px solid var(--border-color);
      padding: 1rem 1.25rem 1.25rem 1.25rem;
    }

    .drawer-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 1.1rem;
      font-weight: 900;
    }

    .drawer-total-row .cart-summary-total { color: var(--kms-red); }

    .btn-clear {
      font-family: inherit;
      background: var(--btn-outline-bg);
      border: 2px solid var(--border-color);
      color: var(--text-main);
      width: 100%;
      padding: 0.65rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    #scanner-container {
      width: 100%;
      max-width: 320px;
      margin: 1rem auto 0 auto;
      border-radius: 14px;
      overflow: hidden;
      border: 4px solid var(--kms-black);
      background: #000;
    }

    .scanner-hint {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin: 10px 1.25rem 1.25rem 1.25rem;
    }

    .scanner-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      width: 100%;
      max-width: 360px;
      margin: 0.85rem auto 0 auto;
      padding: 0 1.25rem;
    }

    .scan-tool-btn {
      flex: 1 1 auto;
      white-space: nowrap;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      border: 2px solid var(--border-color);
      background: var(--surface);
      color: var(--text-main);
      cursor: pointer;
    }

    .scan-tool-btn.on {
      background: var(--kms-red);
      border-color: var(--kms-red);
      color: var(--kms-white);
    }

    /* Browse our stock: every card the shop has, with pictures, counts and prices */
    .stock-open-btn { max-width: 380px; margin-top: 1.25rem; }
    .stock-drawer { max-width: 900px; height: 92vh; max-height: 92vh; }
    .stock-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.85rem 1.25rem 0.5rem 1.25rem;
    }
    .stock-tools input, .stock-tools select {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      background: var(--surface);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 0.55rem 0.7rem;
      min-width: 0;
    }
    .stock-tools input { flex: 1 1 100%; font-size: 1rem; }
    .stock-tools select { flex: 1 1 40%; }
    .stock-status { font-size: 0.75rem; font-weight: 600; color: var(--text-sub); padding: 0 1.25rem 0.5rem 1.25rem; }
    .stock-list { overflow-y: auto; flex: 1; padding: 0.25rem 1.25rem 1.25rem 1.25rem; }
    .stock-set-title {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--kms-red);
      margin: 1rem 0 0.5rem 0;
    }
    .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; }
    .stock-tile {
      font-family: inherit;
      text-align: left;
      color: var(--text-main);
      background: var(--surface);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 0.5rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .stock-tile img {
      width: 100%;
      aspect-ratio: 5 / 7;
      object-fit: contain;
      border-radius: 6px;
      background: var(--line-soft);
    }
    .stock-tile-name { font-size: 0.85rem; font-weight: 800; line-height: 1.2; }
    .stock-tile-set { font-size: 0.7rem; font-weight: 600; color: var(--text-sub); }
    .stock-tile-conds { display: flex; flex-direction: column; gap: 2px; margin-top: 0.15rem; }
    .stock-cond { display: flex; justify-content: space-between; gap: 0.35rem; font-size: 0.75rem; font-weight: 700; }
    .stock-cond-price { color: var(--kms-red); font-weight: 800; white-space: nowrap; }

    /* Tablets and computers */
    @media (min-width: 760px) {
      .stock-open-btn { max-width: 820px; }
      .stock-drawer { height: 88vh; max-height: 88vh; }
      .stock-tools input { flex: 2 1 260px; }
      .stock-tools select { flex: 1 1 160px; }
      .stock-grid { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); }

      body { padding-bottom: 6.5rem; }

      .brand {
        padding: 1.75rem 4rem 4.5rem 4rem;
        border-radius: 0 0 50% 50% / 0 0 72px 72px;
      }
      .brand-name { font-size: 1.6rem; }
      .brand-tag { font-size: 0.8rem; }
      .theme-toggle { top: 1.25rem; right: 1.5rem; width: 44px; height: 44px; }

      .brand-logo {
        width: 120px;
        height: 120px;
        margin-top: -60px;
        margin-bottom: 1.5rem;
      }

      .card {
        max-width: 820px;
        padding: 2.25rem;
      }

      /* Card art on the left, details on the right */
      .card-view {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 2.5rem;
        align-items: center;
        text-align: left;
      }

      .card-art { width: 260px; margin: 0; }
      h1 { font-size: 1.9rem; }
      .set-info { font-size: 0.95rem; }
      .price { font-size: 3rem; }

      .card-view .action-stack {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .card-view .btn-cart { grid-column: 1 / -1; }
      .card-view .btn-link { font-size: 0.95rem; padding: 0.85rem 1rem; }

      .empty-state { padding: 2rem 0; }
      .empty-state .btn { max-width: 320px; }

      .cart-bar { padding: 1rem 2rem; }
      .cart-bar-btn { padding: 0.65rem 1.25rem; font-size: 0.95rem; }

      /* Cart and scanner open as centered windows */
      .drawer-overlay { align-items: center; padding: 2rem; }
      .drawer {
        border-bottom: 3px solid var(--border-color);
        border-radius: 22px;
        max-height: 80vh;
        box-shadow: 0 10px 0 var(--card-shadow);
      }
    }

    /* Hover effects for mouse users */
    @media (hover: hover) {
      .btn:hover, .cart-bar-btn:hover { filter: brightness(1.1); }
      .qty-btn:hover, .theme-toggle:hover { border-color: var(--kms-red); }

    /* GG Crafts & Collectibles stickers (?shop=gg): colors from the GG logo, blush pink, black
       script, white. Same as the staff app's GG profile (app.css in the app repo). */
    :root[data-shop="gg"] {

      --border-color: #e6c9cb;

      --card-shadow: #f2d2d4;
      --text-main: #1d1d1f;
      --text-sub: #7a6669;
      --band-bg: #1d1d1f;
      --band-border: #1d1d1f;
      --btn-alt-bg: #1d1d1f;
      --btn-alt-fg: #ffffff;
      --btn-outline-bg: #ffffff;

    }
    :root[data-shop="gg"] .brand {

    :root[data-shop="gg"] .brand-name { letter-spacing: 0.12em; font-weight: 800; }
    :root[data-shop="gg"] .brand-tag { letter-spacing: 0.3em; }

  </style>
</head>
<body>

  <header class="brand">
    <div class="brand-name">Kanto Misplay Society</div>
    <div class="brand-tag">Price Check</div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Switch to light mode" title="Switch to light mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
    </button>
  </header>
  <img class="brand-logo" src="logo.jpg" alt="KMS logo" onerror="this.style.display='none'">
  <script>if (SHOP === 'gg') showShop('gg');</script>

  <div class="card" id="cardContainer">
    <div class="loading" id="status">Loading live price...</div>
  </div>

  <button class="btn btn-link stock-open-btn" id="browseStockBtn" onclick="openStock(true)">Browse Our Stock</button>

  <div class="cart-bar" id="cartBar">
    <div class="cart-bar-inner">
      <div onclick="toggleCartDrawer(true)" style="cursor:pointer; flex: 1;">

  <div class="drawer-overlay" id="drawerOverlay" onclick="handleOverlayClick(event, 'drawerOverlay')">

      </div>

  <div class="drawer-overlay" id="scannerOverlay" onclick="handleOverlayClick(event, 'scannerOverlay')">
    <div class="drawer" style="align-items: center; text-align: center;">
      <div class="drawer-header" style="width: 100%;">
        <h2>Point at QR Code</h2>
        <button class="close-btn" onclick="stopInAppScanner()">&times;</button>
      </div>

      <div class="scanner-actions">
        <button class="scan-tool-btn" id="torchBtn" onclick="toggleTorch()" style="display:none">🔦 Flashlight</button>
        <button class="scan-tool-btn" id="zoomBtn" onclick="toggleZoom()" style="display:none">🔍 Zoom 2×</button>
        <button class="scan-tool-btn" onclick="takePhoto()">📷 Take Photo</button>
      </div>

  <div class="drawer-overlay" id="stockOverlay" onclick="handleOverlayClick(event, 'stockOverlay')">
    <div class="drawer stock-drawer">
      <div class="drawer-header">
        <h2>Our Stock</h2>

      </div>
      <div class="stock-tools">
        <input type="search" id="stockSearch" placeholder="Search cards…" aria-label="Search cards" oninput="renderStock()">
        <select id="stockSet" aria-label="Set" onchange="renderStock()"><option value="">All sets</option></select>
        <select id="stockSort" aria-label="Sort" onchange="renderStock()">
          <option value="set">Sort: Set</option>
          <option value="name">Sort: Name</option>
          <option value="high">Price: High to low</option>
          <option value="low">Price: Low to high</option>
        </select>
      </div>
      <div class="stock-status" id="stockStatus"></div>
      <div class="stock-list" id="stockList"><div class="loading">Loading our stock...</div></div>
    </div>
  </div>

  <script>
    var cardId = new URLSearchParams(window.location.search).get('id');
    var cardCondition = new URLSearchParams(window.location.search).get('cond');
    var priceCatalog = null;
    var currentCardData = null;
    var currentCondition = null;

    // Condition pricing for overnumbered and Classic Collection cards, as a percent of the Near Mint market price.
    // Change the percents here to adjust store pricing.
    var CONDITIONS = [
      { code: 'NM', label: 'Near Mint', percent: 100 },
      { code: 'LP', label: 'Lightly Played', percent: 85 },
      { code: 'MP', label: 'Moderately Played', percent: 70 },
      { code: 'HP', label: 'Heavily Played', percent: 50 },
      { code: 'DMG', label: 'Damaged', percent: 30 }
    ];
    var html5QrScanner = null;
    var scannerStopping = Promise.resolve();
    var scanHandled = false;
    var cart = [];

    try {
      cart = JSON.parse(localStorage.getItem('kms_cart') || '[]');
      if (!Array.isArray(cart)) cart = [];
    } catch (e) {
      cart = [];
    }

    // Dark mode is the default; the choice is remembered on this device
    function updateThemeToggle() {
      var isLight = document.documentElement.getAttribute('data-theme') === 'light';
      var label = isLight ? 'Switch to dark mode' : 'Switch to light mode';
      var btn = document.getElementById('themeToggle');
      if (btn) {
        btn.setAttribute('aria-label', label);
        btn.setAttribute('title', label);
      }
    }

    function toggleTheme() {
      var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try {
        localStorage.setItem('kms_theme', next);
      } catch (e) {}
      updateThemeToggle();
    }

    function saveCart() {
      try {
        localStorage.setItem('kms_cart', JSON.stringify(cart));
      } catch (e) {}
      renderCartUI();
    }

    function money(n) {
      return '$' + (Number(n) || 0).toFixed(2);
    }

    // Tries GitHub Raw CDN first, falls back to jsDelivr mirror if blocked
    async function fetchCatalog() {
      if (priceCatalog) return priceCatalog;

      var endpoints = [
        'https://raw.githubusercontent.com/nymsworld/Card.api/main/prices.json?v=' + Date.now(),
        'https://cdn.jsdelivr.net/gh/nymsworld/Card.api@main/prices.json'
      ];

      for (var i = 0; i < endpoints.length; i++) {
        try {
          var res = await fetch(endpoints[i]);
          if (res.ok) {
            var catalog = await res.json();
            await addConditionPrices(catalog);
            priceCatalog = catalog;
            return priceCatalog;
          }
        } catch (e) {}
      }

      throw new Error('Could not fetch price database from mirrors.');
    }

    // The fast way to look up one scanned card: prices.json is also published split into small
    // files (cards/<n>.json, written by update_prices.py; shardOf must match its shard_of), so a
    // scan downloads one small file instead of every card. prices_version.json (a few bytes) says when
    // they last changed, so the browser reuses its saved copy until then. The shop app and staff web
    // app set KMS_FULL_CATALOG: they need every card anyway (search, sales) and keep it offline.
    var CARD_FILES = 'https://raw.githubusercontent.com/nymsworld/Card.api/main/';
    var SHARD_COUNT = 128;

    function shardOf(id) {
      var s = normalizeId(id);
      var h = 0;
      for (var i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) >>> 0;
      return h % SHARD_COUNT;
    }

    // The scanned card from its small file, with staff condition prices; null if it isn't there.
    // Throws if the small files can't be read, so the caller falls back to the full download.
    async function fetchCardFast(targetId) {
      var version = '';
      try {
        var v = await fetch(CARD_FILES + 'prices_version.json?v=' + Date.now(), { cache: 'no-store' });
        if (v.ok) version = (await v.json()).updatedAt || '';
      } catch (e) {}
      var res = await fetch(CARD_FILES + 'cards/' + shardOf(targetId) + '.json?v=' + encodeURIComponent(version || Date.now()));
      if (!res.ok) throw new Error('Card file not available');
      var shard = await res.json();
      var card = findCard(shard, targetId);
      if (card) await addConditionPrices(shard, true); // TCGplayer condition prices are already in the file
      return card;
    }

    // Condition prices for expensive cards, each { prices: { cardId: { LP: 210, DMG: 37, ... } } }:
    //   condition_prices.json: set by staff in the shop app -> card.conditionPrices (store prices)
    //   condition_market.json: TCGplayer market by condition, fetched weekly -> card.conditionMarket,
    //     and when it was fetched -> card.conditionMarketAt
    // Without them, cards over CONDITION_GUESS_MAX just show "Ask staff" below Near Mint.
    // staffOnly: just condition_prices.json (the small card files already include the market ones).
    async function addConditionPrices(catalog, staffOnly) {
      await Promise.all([
        ['condition_prices.json', 'conditionPrices'],
        ['condition_market.json', 'conditionMarket', 'conditionMarketAt']
      ].filter(function (file, i) { return !staffOnly || i === 0; }).map(async function (file) {
        var endpoints = [
          'https://raw.githubusercontent.com/nymsworld/Card.api/main/' + file[0] + '?v=' + Date.now(),
          'https://cdn.jsdelivr.net/gh/nymsworld/Card.api@main/' + file[0]
        ];
        for (var i = 0; i < endpoints.length; i++) {
          try {
            var res = await fetch(endpoints[i]);
            if (!res.ok) continue;
            var data = await res.json();
            var set = data.prices || {};
            for (var id in set) {
              if (!catalog[id]) continue;
              catalog[id][file[1]] = set[id];
              if (file[2]) catalog[id][file[2]] = data.fetchedAt || null;
            }
            return;
          } catch (e) {}
        }
      }));
    }

    // Finds a card by ID, ignoring case and leading zeros (MEP-023 = mep-23)
    function normalizeId(id) {
      return String(id).trim().toLowerCase().replace(/-0+(?=\d)/g, '-');
    }

    function findCard(catalog, targetId) {
      if (catalog[targetId]) return catalog[targetId];
      var want = normalizeId(targetId);
      for (var key in catalog) {
        if (normalizeId(key) === want) return catalog[key];
      }
      return null;
    }

    function findCondition(code) {
      code = String(code || '').toUpperCase();
      for (var i = 0; i < CONDITIONS.length; i++) {
        if (CONDITIONS[i].code === code) return CONDITIONS[i];
      }
      return null;
    }

    // Same rounding as update_prices.py: round up from 30 cents, $1.00 minimum
    function storePrice(rawMarket) {
      var dollars = Math.floor(rawMarket);
      var rounded = (rawMarket - dollars >= 0.30) ? dollars + 1 : dollars;
      return Math.max(1, rounded);
    }

    // Below Near Mint, expensive cards lose far more than the CONDITIONS percents (a damaged
    // $300 card can sell for 12% of Near Mint), so above this Near Mint price a condition uses
    // its own TCGplayer market price (condition_market.json), or shows "Ask staff" without one.
    // Must match CONDITION_MARKET_MIN in update_prices.py.
    var CONDITION_GUESS_MAX = 50;

    // Where a card's price in a condition comes from: 'nm', 'staff' (set in the shop app),
    // 'market' (TCGplayer market for that condition), 'percent' (of Near Mint) or null (ask staff).
    // A staff price holds until it's changed, or until a TCGplayer fetch made after it has a solid
    // (conclusive) price for that condition; condition_market.json only keeps conclusive ones.
    function conditionSource(card, condition) {
      if (!condition || condition.percent === 100 || card.rawMarket == null) return 'nm';
      var staff = card.conditionPrices && card.conditionPrices[condition.code] != null;
      var market = card.conditionMarket && card.conditionMarket[condition.code] != null;
      if (staff && market && card.conditionMarketAt && card.conditionPrices.updatedAt &&
          Date.parse(card.conditionMarketAt) > Date.parse(card.conditionPrices.updatedAt)) return 'market';
      if (staff) return 'staff';
      if (card.rawMarket > CONDITION_GUESS_MAX) return market ? 'market' : null;
      return 'percent';
    }

    // Store price for a card in a condition, or null when staff need to price it
    function conditionPrice(card, condition) {
      var source = conditionSource(card, condition);
      if (source === 'nm') return Number(card.price) || 0;
      if (source === 'staff') return Number(card.conditionPrices[condition.code]);
      if (source === 'market') return storePrice(card.conditionMarket[condition.code]);
      if (source === 'percent') return storePrice(card.rawMarket * condition.percent / 100);
      return null;
    }

    // Always a number: the staff price, or the percent-of-Near-Mint estimate when there isn't one
    function priceForCondition(card, condition) {
      var price = conditionPrice(card, condition);
      return price != null ? price : storePrice(card.rawMarket * condition.percent / 100);
    }

    function setCondition(code) {
      if (!currentCardData) return;
      var params = new URLSearchParams(window.location.search);
      params.set('cond', code);
      window.history.replaceState({}, '', '?' + params.toString());
      displayCard(currentCardData, code);
    }

    function displayCard(card, conditionCode) {
      var container = document.getElementById('cardContainer');
      currentCardData = card;
      // Overnumbered cards and Classic Collection cards are priced by condition
      var hasConditions = card.conditionPricing || card.overnumbered;
      currentCondition = hasConditions ? (findCondition(conditionCode) || CONDITIONS[0]) : null;
      var price = conditionPrice(card, currentCondition);
      var source = conditionSource(card, currentCondition);

      var floorNote = '';
      var conditionRaw = card.rawMarket != null && currentCondition ? card.rawMarket * currentCondition.percent / 100 : card.rawMarket;
      if (price == null) {
        floorNote = '<div class="floor-note">' + currentCondition.label + ' copies are priced by staff · ask at the counter</div>';
      } else if (source === 'staff') {
        floorNote = '<div class="floor-note">' + currentCondition.label + ' · priced by staff</div>';
      } else if (source === 'market') {
        floorNote = '<div class="floor-note">' + currentCondition.label + ' · TCGplayer market for this condition</div>';
      } else if (conditionRaw != null && conditionRaw < 1.00) {
        floorNote = '<div class="floor-note">($1.00 store floor applied)</div>';
      } else if (currentCondition && currentCondition.percent !== 100) {
        floorNote = '<div class="floor-note">' + currentCondition.label + ' · ' + currentCondition.percent + '% of Near Mint</div>';
      }

      var conditionHtml = '';
      if (currentCondition) {
        conditionHtml = '<div class="condition-picker"><div class="label">Condition</div><div class="condition-options">';
        for (var i = 0; i < CONDITIONS.length; i++) {
          var c = CONDITIONS[i];
          conditionHtml += '<button class="condition-btn' + (c.code === currentCondition.code ? ' active' : '') + '" onclick="setCondition(\'' + c.code + '\')" title="' + c.label + '">' + c.code + '</button>';
        }
        conditionHtml += '</div></div>';
      }

      var imgHtml = card.image ? '<img src="' + card.image + '" alt="' + card.name + '" class="card-art">' : '';
      var numTotal = card.printedTotal ? '/' + card.printedTotal : '';

      container.innerHTML =
        '<div class="card-view">' +
          imgHtml +
          '<div class="card-details">' +
            '<div class="badge">' + (card.rarity || 'Double Rare') + '</div>' +
            '<h1>' + card.name + '</h1>' +
            '<div class="set-info">' + (card.game && card.game !== 'Pokémon' ? card.game + ' · ' : '') + card.setName + (card.number ? ' · #' + card.number + numTotal : '') + '</div>' +
            conditionHtml +
            '<div class="price-container">' +
              '<div class="label">Store Price' + (currentCondition ? ' · ' + currentCondition.code : '') + '</div>' +
              '<div class="price">' + (price == null ? 'Ask staff' : money(price)) + '</div>' +
              floorNote +
            '</div>' +
            '<div class="action-stack">' +
              '<button class="btn btn-cart" onclick="addToCartCurrent()"' + (price == null ? ' disabled' : '') + '>+ Add to List</button>' +
              '<button class="btn btn-scan" onclick="startInAppScanner()">Scan Another Card</button>' +
              (card.tcgUrl ? '<a class="btn btn-link" href="' + card.tcgUrl + '" target="_blank" rel="noopener">View on TCGplayer</a>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
    }

    async function loadCard(targetId, conditionCode) {
      var container = document.getElementById('cardContainer');
      if (!targetId) {
        currentCardData = null;
        container.innerHTML =
          '<div class="empty-state">' +
            '<h2>Scan a Card</h2>' +
            '<p>Scan a sticker QR code to view live pricing.</p>' +
            '<button class="btn btn-scan" onclick="startInAppScanner()" style="margin-top:1rem;">Open Scanner</button>' +
          '</div>';
        return;
      }

      container.innerHTML = '<div class="loading">Loading live price...</div>';

      try {
        var card;
        var fast = false;
        if (!window.KMS_FULL_CATALOG && !priceCatalog) {
          try {
            card = await fetchCardFast(targetId);
            fast = !!card; // not in its file (e.g. added minutes ago): make sure with the full list
          } catch (e) { /* small files not published yet, or unreachable: the full download below */ }
        }
        if (!fast) card = findCard(await fetchCatalog(), targetId);

        if (!card) {
          currentCardData = null;
          container.innerHTML = '<div class="error">Card ID "<strong>' + targetId + '</strong>" not found in catalog.<br><br><button class="btn btn-scan" onclick="startInAppScanner()">Scan Different Card</button></div>';
          return;
        }

        if (!card.id) card.id = targetId;
        displayCard(card, conditionCode);
      } catch (err) {
        container.innerHTML = '<div class="error">' + err.message + '<br><br><button class="btn btn-link" onclick="location.reload()">Tap to Retry</button></div>';
      }
    }

    function handleScan(decodedText) {
      // The scanner can fire several times for one code; only act on the first
      if (scanHandled) return;
      scanHandled = true;

      var text = (decodedText || '').trim();
      var id = text;
      var cond = null;
      var link = stickerLink(text);
      if (link) {
        id = link.id;
        cond = link.cond;
        if (link.shop && link.shop !== SHOP) showShop(link.shop);
      }

      stopInAppScanner();
      window.history.pushState({}, '', shopQuery(id, cond));
      loadCard(id, cond);
    }

    var DEFAULT_SCAN_HINT = 'Camera will automatically detect the card sticker.';
    // 720p everywhere: read at full detail (readFullDetail) a small sticker reads from further away; 1080p
    // made Android phones scan slower with no gain
    var VIDEO_WIDTH = { ideal: 1280 };
    var VIDEO_HEIGHT = { ideal: 720 };
    var photoScanner = null;
    var torchOn = false;

    // QR codes only, and use the phone's built-in detector when it has one
    function scannerOptions() {
      var options = { verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } };
      if (typeof Html5QrcodeSupportedFormats !== 'undefined') {
        options.formatsToSupport = [Html5QrcodeSupportedFormats.QR_CODE];
      }
      return options;
    }

    // Scan box covers ~70% of the view so cards can be held far enough away to focus
    function scanBoxSize(viewWidth, viewHeight) {
      var size = Math.max(150, Math.floor(Math.min(viewWidth, viewHeight) * 0.7));
      return { width: size, height: size };
    }

    function setScannerHint(text) {
      document.getElementById('scannerHint').textContent = text;
    }

    // 15 checks a second, and no second, mirrored try on each frame (printed stickers are never mirrored;
    // on phones without a built-in QR detector that halves the work per frame). The shop's app can ask
    // for fewer to save battery (window.KMS_SCAN_FPS).
    function startCamera(videoConstraints) {
      return html5QrScanner.start(
        { facingMode: 'environment' },
        { fps: window.KMS_SCAN_FPS || 15, qrbox: scanBoxSize, disableFlip: true, videoConstraints: videoConstraints },
        handleScan,
        function() {}
      );
    }

    // Reading small stickers from further away. The scanner library shrinks the scan box's part of the camera
    // picture to the box's size on screen before reading it (half the camera's detail or less), so the scanner
    // reads that part at the camera's own resolution instead (at most 800 px across); and two frames in three
    // are sharpened first: a sticker a few inches away is only 2-3 camera pixels per QR square, where the
    // slightest blur stopped every read. The library makes its canvas when the first frame arrives (setupUi,
    // after start() resolves), so it's hooked there, once (the shop's app does the same, same flag).
    var SHARPEN = [1, 2, 0]; // strength per frame, in turn (0 = as the camera saw it)
    var sharpenGray = null;
    function sharpenCanvas(ctx, w, h, amount) {
      var img = ctx.getImageData(0, 0, w, h), d = img.data, n = w * h;
      if (!sharpenGray || sharpenGray.length !== n) sharpenGray = new Uint8ClampedArray(n);
      var gray = sharpenGray;
      for (var i = 0, j = 0; i < n; i++, j += 4) gray[i] = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8;
      var centre = 1 + 4 * amount;
      for (var y = 1; y < h - 1; y++) {
        for (var p = y * w + 1, end = p + w - 2; p < end; p++) {
          var o = p << 2;
          d[o] = d[o + 1] = d[o + 2] = centre * gray[p] - amount * (gray[p - 1] + gray[p + 1] + gray[p - w] + gray[p + w]);
        }
      }
      ctx.putImageData(img, 0, 0);
    }
    function readFullDetail() {
      if (typeof Html5Qrcode === 'undefined') return;
      var proto = Html5Qrcode.prototype;
      if (proto.kmsFullDetail || typeof proto.setupUi !== 'function') return;
      var setupUi = proto.setupUi;
      proto.setupUi = function() {
        var result = setupUi.apply(this, arguments);
        var ctx = this.context;
        if (ctx && !ctx.kmsFullDetail) {
          var draw = ctx.drawImage, frame = 0;
          ctx.drawImage = function(image, sx, sy, sw, sh) {
            if (arguments.length !== 9 || !sw || !sh) return draw.apply(this, arguments);
            var k = Math.min(1, 800 / Math.max(sw, sh));
            var w = Math.round(sw * k), h = Math.round(sh * k);
            if (this.canvas.width !== w || this.canvas.height !== h) { this.canvas.width = w; this.canvas.height = h; }
            draw.call(this, image, sx, sy, sw, sh, 0, 0, w, h);
            var amount = SHARPEN[frame++ % SHARPEN.length];
            if (amount) { try { sharpenCanvas(this, w, h, amount); } catch (e) {} }
          };
          ctx.kmsFullDetail = true;
        }
        return result;
      };
      proto.kmsFullDetail = true;
    }

    function startInAppScanner() {
      var overlay = document.getElementById('scannerOverlay');
      overlay.classList.add('active');
      toggleCartDrawer(false);
      setScannerHint(DEFAULT_SCAN_HINT);

      if (typeof Html5Qrcode === 'undefined') {
        alert('Scanner library failed to load. Check your internet connection.');
        overlay.classList.remove('active');
        return;
      }

      readFullDetail();
      if (!html5QrScanner) {
        html5QrScanner = new Html5Qrcode('scanner-container', scannerOptions());
      }

      // Wait for any previous stop to finish before starting again
      scannerStopping.then(function() {
        if (!overlay.classList.contains('active') || html5QrScanner.isScanning) return;
        scanHandled = false;
        // Ask for 720p with continuous focus; fall back to the camera's defaults if refused
        return startCamera({
          facingMode: { ideal: 'environment' },
          width: VIDEO_WIDTH,
          height: VIDEO_HEIGHT,
          advanced: [{ focusMode: 'continuous' }]
        }).catch(function() {
          return startCamera({ facingMode: 'environment' });
        }).then(setupCameraExtras);
      }).catch(function(err) {
        console.error('Camera start failed', err);
        // Keep a "no QR code in that photo" message if one is showing
        if (document.getElementById('scannerHint').textContent === DEFAULT_SCAN_HINT) {
          setScannerHint('Live camera unavailable. Tap "Take Photo" to scan with your camera app instead.');
        }
      });
    }

    // Shows the flashlight button and turns on continuous focus when the camera supports them
    function setupCameraExtras() {
      if (!document.getElementById('scannerOverlay').classList.contains('active')) {
        stopCamera();
        return;
      }

      var caps = {};
      try {
        caps = html5QrScanner.getRunningTrackCapabilities() || {};
      } catch (e) {}

      torchOn = false;
      updateTorchButton(!!caps.torch);
      // Zoom: phones can't focus on a small sticker held very close, so zooming in lets it be read from
      // further back. Remembered on this device.
      zoomRange = caps.zoom && caps.zoom.max >= 1.5 ? caps.zoom : null;
      zoomOn = savedZoom();
      cameraRunning = true;
      updateZoomButton();
      if (zoomOn) setZoom();
      else if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) applyCameraSettings().catch(function() {});
    }

    function applyCameraSettings() {
      // Separate sets so a camera without a flashlight still gets continuous focus (and zoom)
      var advanced = [{ torch: torchOn }, { focusMode: 'continuous' }];
      if (zoomRange) advanced.push({ zoom: zoomOn ? Math.min(2, zoomRange.max) : Math.max(1, zoomRange.min || 1) });
      return html5QrScanner.applyVideoConstraints({
        width: farMode ? { ideal: 1920 } : VIDEO_WIDTH,
        height: farMode ? { ideal: 1080 } : VIDEO_HEIGHT,
        advanced: advanced
      });
    }

    var zoomRange = null;
    var zoomOn = false;
    var farMode = false; // zoomed without the camera's own zoom: 1080p while zoomed
    var cameraRunning = false;
    function savedZoom() {
      try { return localStorage.getItem('kms_scan_zoom') === '1'; } catch (e) { return false; }
    }
    function updateZoomButton() {
      var btn = document.getElementById('zoomBtn');
      btn.style.display = cameraRunning ? '' : 'none';
      btn.classList.toggle('on', zoomOn);
      btn.textContent = zoomOn ? '🔍 Zoomed in' : '🔍 Zoom 2×';
    }
    // The camera's own zoom when it really zooms (checked afterwards: some phones say they can and then
    // don't, and iPhone Safari can't); otherwise the camera switches to 1080p (more detail on a far sticker,
    // ~6 inches; more work per frame, so only while zoomed) and the picture on screen is shown at 2× (the
    // scanner still reads the whole camera picture, so a sticker anywhere in view is still found)
    function setZoom() {
      var on = zoomOn;
      var camera = zoomRange
        ? applyCameraSettings().then(function() {
            var z = (html5QrScanner.getRunningTrackSettings() || {}).zoom;
            return !on || z >= 1.4;
          }, function() { return false; })
        : Promise.resolve(!on);
      return camera.then(function(zoomed) {
        var far = on && !zoomed;
        var video = document.querySelector('#scanner-container video');
        if (video) video.style.transform = far ? 'scale(2)' : '';
        if (far === farMode || !cameraRunning) return;
        farMode = far;
        return applyCameraSettings().catch(function() {});
      });
    }
    function toggleZoom() {
      if (!html5QrScanner || !html5QrScanner.isScanning) return;
      zoomOn = !zoomOn;
      try { localStorage.setItem('kms_scan_zoom', zoomOn ? '1' : '0'); } catch (e) {}
      updateZoomButton();
      setZoom();
    }

    function updateTorchButton(show) {
      var btn = document.getElementById('torchBtn');
      if (show !== undefined) btn.style.display = show ? '' : 'none';
      btn.classList.toggle('on', torchOn);
      btn.textContent = torchOn ? '🔦 Light On' : '🔦 Flashlight';
    }

    function toggleTorch() {
      if (!html5QrScanner || !html5QrScanner.isScanning) return;
      torchOn = !torchOn;
      applyCameraSettings().catch(function() {
        torchOn = !torchOn;
      }).then(function() {
        updateTorchButton();
      });
    }

    function stopCamera() {
      torchOn = false;
      updateTorchButton(false);
      zoomRange = null;
      farMode = false;
      cameraRunning = false;
      updateZoomButton();
      if (html5QrScanner && html5QrScanner.isScanning) {
        scannerStopping = html5QrScanner.stop().catch(function() {});
      }
    }

    function stopInAppScanner() {
      var overlay = document.getElementById('scannerOverlay');
      overlay.classList.remove('active');
      stopCamera();
    }

    // Opens the phone's own camera app, which focuses better than live video on weak cameras
    function takePhoto() {
      stopCamera();
      document.getElementById('photoInput').click();
    }

    function handlePhoto(input) {
      var file = input.files && input.files[0];
      input.value = '';
      if (!file) {
        startInAppScanner();
        return;
      }

      setScannerHint('Reading photo...');
      scannerStopping.then(function() {
        return shrinkImage(file);
      }).then(function(image) {
        if (!photoScanner) photoScanner = new Html5Qrcode('photo-reader', scannerOptions());
        return photoScanner.scanFile(image, false);
      }).then(function(decodedText) {
        scanHandled = false;
        handleScan(decodedText);
      }).catch(function() {
        startInAppScanner();
        setScannerHint('No QR code found in that photo. Fill the frame with the sticker and try again.');
      });
    }

    // Large phone photos are slow to decode; scale them down to 1600px first
    function shrinkImage(file) {
      return new Promise(function(resolve) {
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function() {
          var scale = Math.min(1, 1600 / Math.max(img.width, img.height));
          if (scale === 1) {
            URL.revokeObjectURL(url);
            resolve(file);
            return;
          }
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          canvas.toBlob(function(blob) {
            resolve(blob ? new File([blob], 'photo.jpg', { type: 'image/jpeg' }) : file);
          }, 'image/jpeg', 0.92);
        };
        img.onerror = function() {
          URL.revokeObjectURL(url);
          resolve(file);
        };
        img.src = url;
      });
    }

    // Resume the live camera if the photo picker is closed without taking a photo
    document.getElementById('photoInput').addEventListener('cancel', function() {
      startInAppScanner();
    });

    // The same card in two conditions gets two separate cart lines
    function cartKey(item) {
      return item.cartKey || item.id;
    }

    function addToCartCurrent() {
      if (!currentCardData || conditionPrice(currentCardData, currentCondition) == null) return;
      var key = currentCardData.id + (currentCondition ? '|' + currentCondition.code : '');
      var existing = cart.find(function(item) { return cartKey(item) === key; });
      if (existing) {
        existing.qty += 1;
      } else {
        var copy = Object.assign({}, currentCardData);
        copy.cartKey = key;
        copy.condition = currentCondition ? currentCondition.code : null;
        copy.price = priceForCondition(currentCardData, currentCondition);
        copy.qty = 1;
        cart.push(copy);
      }
      saveCart();
      toggleCartDrawer(true);
    }

    function updateQty(key, delta) {
      var item = cart.find(function(i) { return cartKey(i) === key; });
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(function(i) { return cartKey(i) !== key; });
      }
      saveCart();
    }

    function removeItem(key) {
      cart = cart.filter(function(i) { return cartKey(i) !== key; });
      saveCart();
    }

    function clearCart() {
      cart = [];
      saveCart();
    }

    function renderCartUI() {
      var itemsList = document.getElementById('cartItemsList');
      var barCount = document.getElementById('cartSummaryCount');
      var barTotal = document.getElementById('cartSummaryTotal');
      var drawerTotal = document.getElementById('drawerGrandTotal');

      var totalItems = cart.reduce(function(sum, item) { return sum + item.qty; }, 0);
      var grandTotal = cart.reduce(function(sum, item) { return sum + (Number(item.price) * item.qty); }, 0);

      var totalStr = money(grandTotal);
      if (barCount) barCount.textContent = totalItems + ' card' + (totalItems === 1 ? '' : 's') + ' selected';
      if (barTotal) barTotal.textContent = totalStr;
      if (drawerTotal) drawerTotal.textContent = totalStr;

      if (!itemsList) return;

      if (cart.length === 0) {
        itemsList.innerHTML = '<div class="cart-empty">Your list is empty.<br>Scan a card above to begin.</div>';
        return;
      }

      var rows = '';
      for (var i = 0; i < cart.length; i++) {
        var it = cart[i];
        var key = cartKey(it);
        var cond = findCondition(it.condition);
        rows +=
          '<div class="cart-item">' +
            '<div class="cart-item-info">' +
              '<div class="cart-item-title">' + it.name + '</div>' +
              '<div class="cart-item-meta">' + it.setName + (it.number ? ' #' + it.number : '') + (cond ? ' · ' + cond.label : '') + '</div>' +
              '<div class="cart-item-price">' + money(it.price * it.qty) + ' (' + money(it.price) + ' ea)</div>' +
            '</div>' +
            '<div class="qty-controls">' +
              '<button class="qty-btn" onclick="updateQty(\'' + key + '\', -1)">−</button>' +
              '<span class="qty-count">' + it.qty + '</span>' +
              '<button class="qty-btn" onclick="updateQty(\'' + key + '\', 1)">+</button>' +
              '<button class="del-btn" onclick="removeItem(\'' + key + '\')" title="Remove">&times;</button>' +
            '</div>' +
          '</div>';
      }
      itemsList.innerHTML = rows;
    }

    function toggleCartDrawer(show) {
      var drawer = document.getElementById('drawerOverlay');
      if (drawer) {
        if (show) drawer.classList.add('active');
        else drawer.classList.remove('active');
      }
    }

    function handleOverlayClick(e, overlayId) {
      if (e.target.id === overlayId) {
        if (overlayId === 'scannerOverlay') stopInAppScanner();
        if (overlayId === 'drawerOverlay') toggleCartDrawer(false);
        if (overlayId === 'stockOverlay') closeStock();
      }
    }

    // ---- Browse our stock ----
    // shop_stock.json lists the cards the shop has in stock and how many of each condition
    // ({ updatedAt, cards: { cardId: count | { NM: 2, LP: 1 } } }). The shop app writes it when
    // stock changes; names, pictures and prices come from prices.json, so prices are always live.
    // The view is ?browse=1, so the phone's back button closes it and a link can open it.
    var stockData = null;
    var stockRows = null;

    async function fetchStock() {
      var endpoints = [
        CARD_FILES + 'shop_stock.json?v=' + Date.now(),
        'https://cdn.jsdelivr.net/gh/nymsworld/Card.api@main/shop_stock.json'
      ];
      for (var i = 0; i < endpoints.length; i++) {
        try {
          var res = await fetch(endpoints[i], { cache: 'no-store' });
          if (res.ok) return await res.json();
          if (res.status === 404 && i === 0) return { cards: {} }; // the shop app hasn't published a list yet
        } catch (e) {}
      }
      throw new Error('Could not load our stock list.');
    }

    function esc(text) {
      return String(text == null ? '' : text).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // The set name shown and grouped by (other games and languages say which)
    function stockSetName(card) {
      return (card.game && card.game !== 'Pokémon' ? card.game + ' · ' : '') + (card.setName || 'Other');
    }

    // TCGplayer's picture of a card's product, for cards whose own picture is missing or doesn't load
    function tcgImage(tcgUrl) {
      var m = String(tcgUrl || '').match(/product\/(\d+)/);
      return m ? 'https://tcgplayer-cdn.tcgplayer.com/product/' + m[1] + '_in_400x400.jpg' : '';
    }

    function stockImageFallback(img) {
      var other = tcgImage(img.getAttribute('data-tcg'));
      img.onerror = null;
      if (other && img.src !== other) img.src = other;
    }

    // One row per card: { id, card, set, conds: [{ code, label, qty, price }], qty, top }
    function buildStockRows(stock, catalog) {
      var rows = [];
      Object.keys(stock.cards || {}).forEach(function (id) {
        var card = findCard(catalog, id);
        if (!card) return; // not priced yet
        var counts = stock.cards[id];
        if (typeof counts === 'number') counts = { '': counts };
        var hasConditions = card.conditionPricing || card.overnumbered;
        var conds = [];
        CONDITIONS.concat([{ code: '', label: '' }]).forEach(function (c) {
          if (!(counts[c.code] > 0)) return;
          var price = hasConditions && c.code ? conditionPrice(card, c) : (Number(card.price) || 0);
          conds.push({ code: c.code, label: c.label, qty: counts[c.code], price: price });
        });
        if (!conds.length) return;
        var prices = conds.map(function (c) { return c.price; }).filter(function (p) { return p != null; });
        rows.push({
          id: card.id || id,
          card: card,
          set: stockSetName(card),
          conds: conds,
          qty: conds.reduce(function (n, c) { return n + c.qty; }, 0),
          top: prices.length ? Math.max.apply(null, prices) : 0
        });
      });
      return rows;
    }

    function compareNumbers(a, b) {
      var na = parseInt(a, 10), nb = parseInt(b, 10);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
      return String(a || '').localeCompare(String(b || ''));
    }

    function stockTileHtml(row) {
      var card = row.card;
      var condHtml = row.conds.map(function (c) {
        return '<div class="stock-cond"><span>' + (c.code ? c.code + ' ' : '') + '× ' + c.qty + '</span>' +
          '<span class="stock-cond-price">' + (c.price == null ? 'Ask staff' : money(c.price)) + '</span></div>';
      }).join('');
      var numTotal = card.printedTotal ? '/' + card.printedTotal : '';
      var src = card.image || tcgImage(card.tcgUrl);
      return '<button class="stock-tile" data-id="' + esc(row.id) + '" data-cond="' + row.conds[0].code + '" onclick="openStockCard(this.dataset.id, this.dataset.cond)">' +
        (src ? '<img loading="lazy" alt="" src="' + esc(src) + '" data-tcg="' + esc(card.tcgUrl || '') + '" onerror="stockImageFallback(this)">' : '') +
        '<div class="stock-tile-name">' + esc(card.name) + '</div>' +
        '<div class="stock-tile-set">' + esc(row.set) + (card.number ? ' · #' + esc(card.number) + numTotal : '') + '</div>' +
        '<div class="stock-tile-conds">' + condHtml + '</div>' +
      '</button>';
    }

    function renderStock() {
      var list = document.getElementById('stockList');
      if (!stockRows) return;
      var words = document.getElementById('stockSearch').value.toLowerCase().split(/\s+/).filter(Boolean);
      var setPick = document.getElementById('stockSet').value;
      var sort = document.getElementById('stockSort').value;

      var rows = stockRows.filter(function (row) {
        if (setPick && row.set !== setPick) return false;
        var text = (row.card.name + ' ' + row.set + ' ' + (row.card.number || '') + ' ' + (row.card.rarity || '')).toLowerCase();
        return words.every(function (w) { return text.indexOf(w) !== -1; });
      });
      rows.sort(function (a, b) {
        if (sort === 'high') return b.top - a.top;
        if (sort === 'low') return a.top - b.top;
        if (sort === 'name') return a.card.name.localeCompare(b.card.name);
        return a.set.localeCompare(b.set) || compareNumbers(a.card.number, b.card.number);
      });

      var count = rows.reduce(function (n, r) { return n + r.qty; }, 0);
      var updated = stockData && stockData.updatedAt ? new Date(stockData.updatedAt) : null;
      document.getElementById('stockStatus').textContent =
        rows.length + (rows.length === 1 ? ' card' : ' cards') + ' · ' + count + ' in stock' +
        (updated ? ' · updated ' + updated.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '');

      if (!rows.length) {
        list.innerHTML = '<div class="cart-empty">' + (stockRows.length ? 'No cards match your search.' : 'Nothing listed right now. Ask staff what we have!') + '</div>';
        return;
      }
      if (sort !== 'set') {
        list.innerHTML = '<div class="stock-grid">' + rows.map(stockTileHtml).join('') + '</div>';
        return;
      }
      var html = '';
      var group = null;
      rows.forEach(function (row) {
        if (row.set !== group) {
          if (group !== null) html += '</div>';
          group = row.set;
          html += '<div class="stock-set-title">' + esc(group) + '</div><div class="stock-grid">';
        }
        html += stockTileHtml(row);
      });
      list.innerHTML = html + '</div>';
    }

    async function loadStock() {
      var list = document.getElementById('stockList');
      list.innerHTML = '<div class="loading">Loading our stock...</div>';
      try {
        var results = await Promise.all([fetchStock(), fetchCatalog()]);
        stockData = results[0];
        stockRows = buildStockRows(stockData, results[1]);
        var sets = {};
        stockRows.forEach(function (row) { sets[row.set] = (sets[row.set] || 0) + 1; });
        var select = document.getElementById('stockSet');
        var picked = select.value;
        select.innerHTML = '<option value="">All sets</option>' + Object.keys(sets).sort().map(function (s) {
          return '<option value="' + esc(s) + '"' + (s === picked ? ' selected' : '') + '>' + esc(s) + ' (' + sets[s] + ')</option>';
        }).join('');
        renderStock();
      } catch (err) {
        stockRows = null;
        list.innerHTML = '<div class="error">' + esc(err.message) + '<br><br><button class="btn btn-link" onclick="loadStock()">Tap to Retry</button></div>';
      }
    }

    // push: add ?browse=1 to the address (not when it's already there, e.g. opened from a link)
    function openStock(push) {
      if (push) {
        var params = new URLSearchParams(window.location.search);
        params.set('browse', '1');
        window.history.pushState({}, '', '?' + params.toString());
      }
      document.getElementById('stockOverlay').classList.add('active');
      if (!stockRows || (stockData && Date.now() - stockLoadedAt > 5 * 60 * 1000)) {
        stockLoadedAt = Date.now();
        loadStock();
      }
    }
    var stockLoadedAt = 0;

    function closeStock() {
      if (new URLSearchParams(window.location.search).get('browse')) {
        window.history.back(); // popstate hides it
      } else {
        document.getElementById('stockOverlay').classList.remove('active');
      }
    }

    function openStockCard(id, cond) {
      document.getElementById('stockOverlay').classList.remove('active');
      window.history.pushState({}, '', shopQuery(id, cond));
      loadCard(id, cond || null);
      window.scrollTo(0, 0);
    }

    // Browser back/forward buttons show the matching card (and the stock list)
    window.addEventListener('popstate', function() {
      var params = new URLSearchParams(window.location.search);
      var shop = params.get('shop') === 'gg' ? 'gg' : 'kms';
      if (shop !== SHOP) showShop(shop);
      if (params.get('browse') && SHOP !== 'gg') openStock(false);
      else document.getElementById('stockOverlay').classList.remove('active');
      loadCard(params.get('id'), params.get('cond'));
    });

    updateThemeToggle();
    loadCard(cardId, cardCondition);
    renderCartUI();
    if (new URLSearchParams(window.location.search).get('browse') && SHOP !== 'gg') openStock(false);
  </script>
</body>
</html>
