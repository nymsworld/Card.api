      html += '<button class="btn-secondary" onclick="document.getElementById(\\'cardContainer\\').style.display=\\'none\\'">Dismiss</button>';
      html += '</div>';

      container.innerHTML = html;
      container.style.display = 'block';
    }

    function handleLookup(text) {
      if (!text) return;
      var cleanKey = text.trim().toUpperCase().replace(/[\\r\\n\\t]/g, '');
      var container = document.getElementById('cardContainer');

      if (CARD_CATALOG[cleanKey]) {
        displayCard(CARD_CATALOG[cleanKey], cleanKey);
      } else {
        container.style.display = 'block';
        container.innerHTML = '<span style="color: #ef4444; font-size: 0.95rem;">Unrecognized Card ID: "' + cleanKey + '"</span>';
      }
    }

    function handleManualSearch() {
      var val = document.getElementById('manualInput').value;
      handleLookup(val);
    }

    var html5QrCode = new Html5Qrcode('reader');
    Html5Qrcode.getCameras().then(function(cameras) {
      if (cameras && cameras.length) {
        var backCam = null;
        for (var i = 0; i < cameras.length; i++) {
          var label = (cameras[i].label || '').toLowerCase();
          if (label.indexOf('back') !== -1 || label.indexOf('rear') !== -1) {
            backCam = cameras[i];
            break;
          }
        }
        if (!backCam) {
          backCam = cameras[cameras.length - 1];
        }

        html5QrCode.start(
          backCam.id,
          {
            fps: 15,
            qrbox: { width: 220, height: 220 }
          },
          function(decodedText) {
            handleLookup(decodedText);
          },
          function(errorMessage) {}
        ).catch(function(err) {
          console.error('Camera start failed', err);
        });
      }
    }).catch(function(err) {
