  <script>
    const params = new URLSearchParams(window.location.search);
    const cardId = params.get('id');

    let cart = JSON.parse(localStorage.getItem('kms_cart') || '[]');
    let currentCardData = null;

    function saveCart() {
      localStorage.setItem('kms_cart', JSON.stringify(cart));
      renderCartUI();
    }

    function calculateStorePrice(rawMarketPrice) {
      if (rawMarketPrice === undefined || rawMarketPrice === null) return 1.00;
      const dollarPart = Math.floor(rawMarketPrice);
      const centsPart = rawMarketPrice - dollarPart;
      let roundedPrice = centsPart >= 0.30 ? dollarPart + 1 : dollarPart;
      return Math.max(1.00, roundedPrice);
    }

    // Cache helper: 4 hour cache expiration
    const CACHE_TTL = 4 * 60 * 60 * 1000;

    function getCachedCard(id) {
      try {
        const itemStr = localStorage.getItem(`kms_cache_${id}`);
        if (!itemStr) return null;
        const item = JSON.parse(itemStr);
        if (Date.now() - item.timestamp > CACHE_TTL) {
          localStorage.removeItem(`kms_cache_${id}`);
          return null;
        }
        return item.data;
      } catch (e) {
        return null;
      }
    }

    function setCachedCard(id, data) {
      try {
        localStorage.setItem(`kms_cache_${id}`, JSON.stringify({
          timestamp: Date.now(),
          data: data
        }));
      } catch (e) {
        // Storage might be full, safe to ignore
      }
    }

    function renderCard(card) {
      const container = document.getElementById('cardContainer');
      const prices = card?.tcgplayer?.prices;
      const rawMarketPrice = prices?.holofoil?.market 
                       || prices?.normal?.market 
                       || prices?.reverseHolofoil?.market;

      const storePrice = calculateStorePrice(rawMarketPrice);
      const priceText = `$${storePrice.toFixed(2)}`;
      let floorNote = '';

      if (rawMarketPrice !== undefined && rawMarketPrice < 1.00) {
        floorNote = `<div class="floor-note">($1.00 store floor applied)</div>`;
      }

      currentCardData = {
        id: card.id,
        name: card.name,
        setName: card.set.name,
        number: card.number,
        printedTotal: card.set.printedTotal,
        price: storePrice,
        image: card?.images?.small || ''
      };

      const tcgUrl = card?.tcgplayer?.url || 'https://www.tcgplayer.com';

      container.innerHTML = `
        ${currentCardData.image ? `<img src="${currentCardData.image}" alt="${card.name}" class="card-art" loading="eager">` : ''}
        <div class="badge">Double Rare</div>
        <h1>${card.name}</h1>
        <div class="set-info">${card.set.name} · #${card.number}/${card.set.printedTotal}</div>
        
        <div class="price-container">
          <div class="label">Store Price</div>
          <div class="price">${priceText}</div>
          ${floorNote}
        </div>

        <button class="btn btn-cart" onclick="addToCartCurrent()">+ Add to List</button>
        <a class="btn btn-link" href="${tcgUrl}" target="_blank" rel="noopener">View on TCGplayer</a>
      `;
    }

    async function loadCard() {
      const container = document.getElementById('cardContainer');
      if (!cardId) {
        container.innerHTML = `<div class="error">No card ID provided in URL.<br><br>Scan a card QR code to view live price.</div>`;
        return;
      }

      // 1. Check local cache first for instant 0ms load
      const cached = getCachedCard(cardId);
      if (cached) {
        renderCard(cached);
        return;
      }

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      try {
        // 2. Fetch with field selection to cut response payload down by ~75%
        const url = `https://api.carddex.dev/compat/pokemontcg/v2/cards/${cardId}?select=id,name,number,set,tcgplayer,images`;
        const res = await fetch(url, { signal: controller.signal });

        clearTimeout(timeoutId);

        if (res.status === 404) {
          container.innerHTML = `<div class="error">Card ID "<strong>${cardId}</strong>" was not found.</div>`;
          return;
        }

        if (!res.ok) {
          container.innerHTML = `<div class="error">Server busy (${res.status}). Please refresh.</div>`;
          return;
        }

        const json = await res.json();
        const card = json.data;

        // Cache the result for subsequent scans
        setCachedCard(cardId, card);
        renderCard(card);

      } catch (err) {
        if (err.name === 'AbortError') {
          container.innerHTML = `<div class="error">Request timed out.<br><br><a href="javascript:location.reload()" style="color:#38bdf8;">Tap here to retry</a></div>`;
        } else {
          container.innerHTML = `<div class="error">Failed to fetch pricing data. Check your connection.</div>`;
        }
      }
    }

    function addToCartCurrent() {
      if (!currentCardData) return;
      const existing = cart.find(item => item.id === currentCardData.id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...currentCardData, qty: 1 });
      }
      saveCart();
      toggleCartDrawer(true);
    }

    function updateQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }
      saveCart();
    }

    function removeItem(id) {
      cart = cart.filter(i => i.id !== id);
      saveCart();
    }

    function clearCart() {
      cart = [];
      saveCart();
    }

    function renderCartUI() {
      const itemsList = document.getElementById('cartItemsList');
      const barCount = document.getElementById('cartSummaryCount');
      const barTotal = document.getElementById('cartSummaryTotal');
      const drawerTotal = document.getElementById('drawerGrandTotal');

      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      const grandTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const totalStr = `$${grandTotal.toFixed(2)}`;
      barCount.textContent = `${totalItems} card${totalItems === 1 ? '' : 's'} selected`;
      barTotal.textContent = totalStr;
      drawerTotal.textContent = totalStr;

      if (cart.length === 0) {
        itemsList.innerHTML = `<div style="text-align:center; color: var(--text-sub); margin-top:2rem;">Your list is empty.<br>Scan or add a card above.</div>`;
        return;
      }

      itemsList.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-title">${item.name}</div>
            <div class="cart-item-meta">${item.setName} #${item.number}</div>
            <div class="cart-item-price">$${(item.price * item.qty).toFixed(2)} ($${item.price.toFixed(2)} ea)</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty('${item.id}', -1)">−</button>
            <span class="qty-count">${item.qty}</span>
            <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
            <button class="del-btn" onclick="removeItem('${item.id}')" title="Remove">&times;</button>
          </div>
        </div>
      `).join('');
    }

    function toggleCartDrawer(show) {
      const drawer = document.getElementById('drawerOverlay');
      if (show) {
        drawer.classList.add('active');
      } else {
        drawer.classList.remove('active');
      }
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'drawerOverlay') {
        toggleCartDrawer(false);
      }
    }

    loadCard();
    renderCartUI();
  </script>
