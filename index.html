<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Market Price</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 0.25rem 0;
      color: #fff;
    }
    .set-info {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }
    .price-container { margin: 1.5rem 0; }
    .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    .price {
      font-size: 2.75rem;
      font-weight: 800;
      color: #4ade80;
      margin-top: 0.25rem;
    }
    .btn {
      display: block;
      width: 100%;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .btn:active { background: #1d4ed8; }
    .loading { color: #94a3b8; font-size: 0.95rem; }
    .error { color: #f87171; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card" id="cardContainer">
    <div class="loading" id="status">Loading live price...</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const cardId = params.get('id');

    async function loadCard() {
      const container = document.getElementById('cardContainer');
      if (!cardId) {
        container.innerHTML = `<div class="error">No card ID provided in URL.<br><br>Scan a card QR code to view live price.</div>`;
        return;
      }

      try {
        const res = await fetch(`https://api.pokemontcg.io/v2/cards/${cardId}`);
        const json = await res.json();
        const card = json.data;

        // Double rares are typically standard Holofoil
const prices = card?.tcgplayer?.prices;
const rawMarketPrice = prices?.holofoil?.market 
                 || prices?.normal?.market 
                 || prices?.reverseHolofoil?.market;

let priceText = 'N/A';

if (rawMarketPrice !== undefined) {
  // Sets minimum floor to $1.00
  const finalPrice = Math.max(1.00, rawMarketPrice);
  priceText = `$${finalPrice.toFixed(2)}`;
}

        const priceText = marketPrice !== undefined ? `$${marketPrice.toFixed(2)}` : 'N/A';
        const tcgUrl = card?.tcgplayer?.url || 'https://www.tcgplayer.com';

        container.innerHTML = `
          <div class="badge">Double Rare</div>
          <h1>${card.name}</h1>
          <div class="set-info">${card.set.name} · #${card.number}/${card.set.printedTotal}</div>
          
          <div class="price-container">
            <div class="label">TCGplayer Market Price</div>
            <div class="price">${priceText}</div>
          </div>

          <a class="btn" href="${tcgUrl}" target="_blank" rel="noopener">View on TCGplayer</a>
        `;
      } catch (err) {
        container.innerHTML = `<div class="error">Failed to fetch pricing data. Check your card ID.</div>`;
      }
    }

    loadCard();
  </script>
</body>
</html>
