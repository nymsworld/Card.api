name: Update Pokemon Card Prices Daily

on:
  schedule:
    # The update is split into 6 parts, about 25 minutes apart, so no single run sends
    # enough requests to the card APIs to get rate limited.
    # GitHub schedules in UTC. 06:05-08:10 UTC stays inside 1-5 AM Eastern all year:
    #   winter (EST): 1:05, 1:30, 1:55, 2:20, 2:45, 3:10 AM
    #   summer (EDT): 2:05, 2:30, 2:55, 3:20, 3:45, 4:10 AM
    # GitHub can start scheduled runs a few minutes late; the gaps leave room for that.
    - cron: '5 6 * * *'    # part 1: Double Rares, ACE SPECs, singles, Classic Collection, promos
    - cron: '30 6 * * *'   # part 2: 151 holos + first half of SV overnumbered + cards by the artists in ARTISTS
    - cron: '55 6 * * *'   # part 3: second half of SV overnumbered + jumbo cards + SV/ME commons-rares over $0.50
    - cron: '20 7 * * *'   # part 4: Mega Evolution overnumbered + Sword & Shield era (V cards, secrets, galleries, promos, Prize Packs)
    - cron: '45 7 * * *'   # part 5: Japanese Pokémon cards + stocked cards (Pokémon, Magic, Yu-Gi-Oh)
    - cron: '10 8 * * *'   # part 6: stamped cards + pattern variants from every set (4:10 AM EDT / 3:10 AM EST)
  # Allows you to click a button and run it manually whenever you want
  workflow_dispatch:
    inputs:
      part:
        description: 'Which part to update (all = everything in one run)'
        type: choice
        options: ['all', '1', '2', '3', '4', '5', '6']
        default: 'all'

permissions:
  contents: write

# Never let two price updates run at the same time
concurrency:
  group: price-update
  cancel-in-progress: false

jobs:
  sync-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Pick Which Part to Run
        id: part
        run: |
          case "${{ github.event.schedule }}" in
            "5 6 * * *")  PART=1 ;;
            "30 6 * * *") PART=2 ;;
            "55 6 * * *") PART=3 ;;
            "20 7 * * *") PART=4 ;;
            "45 7 * * *") PART=5 ;;
            "10 8 * * *") PART=6 ;;
            *)            PART="${{ github.event.inputs.part || 'all' }}" ;;
          esac
          echo "part=$PART" >> "$GITHUB_OUTPUT"

      - name: Run Price Updater
        env:
          # Condition prices (LP-DMG) for expensive cards; the step is skipped without it
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
        run: |
          python update_prices.py ${{ steps.part.outputs.part }}

      - name: Commit and Push Updated prices.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json prices_version.json cards price_history.json condition_market.json
          git commit -m "Auto-update prices.json (part ${{ steps.part.outputs.part }}) [skip ci]" || exit 0
          git pull --rebase
          git push
