name: Update Pokemon Card Prices Daily

on:
  schedule:
    # The update is split into 9 parts, about 25 minutes apart, so no single run sends
    # enough requests to the card APIs to get rate limited.
    # GitHub schedules in UTC. 06:05-09:25 UTC is overnight Eastern all year:
    #   winter (EST): 1:05, 1:30, 1:55, 2:20, 2:45, 3:10, 3:35, 4:00, 4:25 AM
    #   summer (EDT): 2:05, 2:30, 2:55, 3:20, 3:45, 4:10, 4:35, 5:00, 5:25 AM
    # GitHub can start scheduled runs a few minutes late; the gaps leave room for that.
    - cron: '5 6 * * *'    # part 1: Double Rares, ACE SPECs, singles, Classic Collection, promos
    - cron: '30 6 * * *'   # part 2: 151 holos + first half of SV overnumbered + cards by the artists in ARTISTS
    - cron: '55 6 * * *'   # part 3: second half of SV overnumbered + jumbo cards + SV/ME commons-rares over $0.50
    - cron: '20 7 * * *'   # part 4: Mega Evolution overnumbered + Sword & Shield era (V cards, secrets, galleries, promos, Prize Packs)
    - cron: '45 7 * * *'   # part 5: Japanese Pokémon cards + stocked cards (Pokémon, Magic, Yu-Gi-Oh)
    - cron: '10 8 * * *'   # part 6: stamped cards + pattern variants from every set
    - cron: '35 8 * * *'   # part 7: every Pokémon sealed product (English and Japanese)
    - cron: '0 9 * * *'    # part 8: every card in Misc. Cards & Products + whole promo sets (McDonald's, BK, Trick or Trade, POP, Rumble, WoTC)
    - cron: '25 9 * * *'   # part 9: every Magic sealed product
  # Allows you to click a button and run it manually whenever you want
  workflow_dispatch:
    inputs:
      part:
        description: 'Which part to update (all = everything in one run)'
        type: choice
        options: ['all', '1', '2', '3', '4', '5', '6', '7', '8', '9']
        default: 'all'

permissions:
  contents: write

# Never let two price updates run at the same time
concurrency:
  group: price-update
  cancel-in-progress: false

jobs:
  sync-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Pick Which Part to Run
        id: part
        run: |
          case "${{ github.event.schedule }}" in
            "5 6 * * *")  PART=1 ;;
            "30 6 * * *") PART=2 ;;
            "55 6 * * *") PART=3 ;;
            "20 7 * * *") PART=4 ;;
            "45 7 * * *") PART=5 ;;
            "10 8 * * *") PART=6 ;;
            "35 8 * * *") PART=7 ;;
            "0 9 * * *")  PART=8 ;;
            "25 9 * * *") PART=9 ;;
            *)            PART="${{ github.event.inputs.part || 'all' }}" ;;
          esac
          echo "part=$PART" >> "$GITHUB_OUTPUT"

      - name: Run Price Updater
        env:
          # Condition prices (LP-DMG) for expensive cards; the step is skipped without it
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
        run: |
          python update_prices.py ${{ steps.part.outputs.part }}

      # If another price run pushed while this one ran, its price files clash with these (every run rewrites
      # them): start again from its files and run this part again, up to 3 times.
      - name: Commit and Push Updated prices.json (and the other games' price files)
        env:
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add prices.json prices_*.json prices_version.json cards price_history.json condition_market.json
            git commit -m "Auto-update prices.json (part ${{ steps.part.outputs.part }}) [skip ci]" || exit 0
            if git pull --rebase && git push; then exit 0; fi
            echo "Another price run pushed first: running part ${{ steps.part.outputs.part }} again on its files"
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python update_prices.py ${{ steps.part.outputs.part }}
          done
          exit 1
